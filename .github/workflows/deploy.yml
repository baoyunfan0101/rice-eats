name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  # The full CI suite must pass before anything is built for deployment,
  # including for direct pushes and manual runs.
  ci:
    uses: ./.github/workflows/ci.yml
    permissions:
      contents: read

  build:
    needs: ci
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      # Validates content and checks dist/ against the allowlist again.
      - run: npm run build
        env:
          # Browser key for nearby restaurant search (a repository variable,
          # not a secret: it ships in the page and is restricted by domain in
          # Geoapify). Without it the site builds and offers manual entry only.
          VITE_GEOAPIFY_API_KEY: ${{ vars.GEOAPIFY_API_KEY }}
      - uses: actions/upload-pages-artifact@v5
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5
